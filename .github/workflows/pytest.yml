name: PyTest

on:
  [workflow_call, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.13"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies for display
        run: |
          sudo apt-get update
          sudo apt-get install -y xserver-xorg-video-dummy x11-xserver-utils

      - name: Generate 60Hz Xorg Dummy Configuration
        run: |
          cat << 'EOF' > xorg-dummy.conf
          Section "Device"
              Identifier  "DummyDevice"
              Driver      "dummy"
          EndSection

          Section "Monitor"
              Identifier  "DummyMonitor"
              HorizSync   15.0-100.0
              VertRefresh 15.0-100.0
              # Custom Modeline for 1920x1080 @ 60.00 Hz
              Modeline    "1920x1080_60.00"  173.00  1920 2048 2248 2576  1080 1083 1088 1120 -hsync +vsync
          EndSection

          Section "Screen"
              Identifier  "DummyScreen"
              Device      "DummyDevice"
              Monitor     "DummyMonitor"
              DefaultDepth 24
              SubSection "Display"
                  Depth       24
                  Modes       "1920x1080_60.00"
              EndSubSection
          EndSection
          EOF

      - name: Start Xorg 60Hz Server
        run: |
          # Launch Xorg headless on display :99 in the background
          sudo Xorg -noreset +extension GLX +extension RANDR +extension RENDER -config ./xorg-dummy.conf :99 &
          
          # Give the X server a moment to spin up safely
          sleep 3

         # Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Install a specific version of uv.
          version: "0.9.18"
          
      # Install dependencies and build the project
      - name: Install dependencies and build package
        run: |
          uv sync --all-extras
          uv build

      - name: Run tests
        run: |
          export DISPLAY=:99
          uv run pytest
